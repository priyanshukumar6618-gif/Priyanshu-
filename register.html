<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration | Priyanshu Classes</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eef3ff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.register-box {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 28px 24px;
    border-radius: 20px;
    box-shadow: 0 10px 35px #10265c20;
}

.logo {
    text-align: center;
    font-size: 28px;
    margin-bottom: 8px;
}

.brand {
    text-align: center;
    font-size: 23px;
    color: #173b87;
    font-weight: bold;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin: 10px 0 25px;
    font-size: 14px;
}

h2 {
    color: #10265c;
    margin-bottom: 8px;
}

.description {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 20px;
    line-height: 1.5;
}

label {
    display: block;
    margin: 15px 0 7px;
    font-size: 14px;
    font-weight: bold;
    color: #334155;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #2563eb;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    border: none;
    border-radius: 9px;
    background: #173b87;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

.message {
    margin-top: 15px;
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
}

.login-link {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #64748b;
}

a {
    color: #2563eb;
    font-weight: bold;
    text-decoration: none;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #64748b;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="register-box">

    <div class="logo">🎓</div>

    <div class="brand">Priyanshu Classes</div>

    <p class="subtitle">Your Learning, Our Mission</p>

    <h2>Create Account ✨</h2>

    <p class="description">
        Register to start your learning journey with us.
    </p>

    <form id="registerForm">

        <label for="name">Full Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
            minlength="2"
        >

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label for="phone">Mobile Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="10-digit mobile number"
            autocomplete="tel"
            inputmode="numeric"
            pattern="[0-9]{10}"
            maxlength="10"
            required
        >

        <label for="password">Create Password</label>

        <input
            type="password"
            id="password"
            placeholder="At least 8 characters"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <label for="confirmPassword">Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Enter password again"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <button type="submit" id="submitButton">
            Create Account
        </button>

        <p class="message" id="message" role="status"></p>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

    <a href="index.html" class="back">← Back to Home</a>

</div>

<script type="module">
import { initializeApp, getApps, getApp }
from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  updateProfile
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB8IW_3JhAhGuVvFwBUoqFKwEFEFZhDr6A",
  authDomain: "priyanshu-24f9b.firebaseapp.com",
  projectId: "priyanshu-24f9b",
  storageBucket: "priyanshu-24f9b.firebasestorage.app",
  messagingSenderId: "656305585506",
  appId: "1:656305585506:web:e75d7a29e9add61e67803b",
  measurementId: "G-PQPWFR9FHY"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("registerForm");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();

  message.style.color = "#b91c1c";

  if (password.value !== confirmPassword.value) {
    message.textContent = "Passwords do not match.";
    return;
  }

  if (!/^[0-9]{10}$/.test(phone)) {
    message.textContent = "Enter a valid 10-digit mobile number.";
    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = "Creating account...";
  message.textContent = "";

  try {
    const credential = await createUserWithEmailAndPassword(
      auth,
      email,
      password.value
    );

    await updateProfile(credential.user, {
      displayName: name
    });

    message.style.color = "#15803d";
    message.textContent =
      "Account created successfully! Redirecting to login...";

    form.reset();

    setTimeout(() => {
      window.location.href = "login.html";
    }, 1800);

  } catch (error) {
    const messages = {
      "auth/email-already-in-use":
        "This email is already registered. Please log in.",
      "auth/invalid-email":
        "Please enter a valid email address.",
      "auth/weak-password":
        "Choose a stronger password.",
      "auth/network-request-failed":
        "Network error. Check your internet connection.",
      "auth/operation-not-allowed":
        "Email/Password sign-in is not enabled in Firebase."
    };

    message.textContent =
      messages[error.code] ||
      "Registration failed. Error: " + error.code;

  } finally {
    submitButton.disabled = false;
    submitButton.textContent = "Create Account";
  }
});
</script>

</body>
</html>
