<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Students | Priyanshu Classes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      background: #172554;
      color: white;
      padding: 22px 18px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    header p {
      margin: 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 16px;
    }

    .panel {
      background: white;
      padding: 20px;
      margin: 18px 0;
      border-radius: 14px;
      box-shadow: 0 3px 12px #0000000c;
    }

    .panel h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .search {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
    }

    .student-card {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .student-card h3 {
      margin: 0 0 10px;
    }

    .student-card p {
      margin: 7px 0;
      color: #475569;
      font-size: 14px;
    }

    .status {
      color: #64748b;
      line-height: 1.6;
      font-size: 14px;
    }

    .back {
      display: inline-block;
      color: #1d4ed8;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>👨‍🎓 Manage Students</h1>
  <p>Priyanshu Classes — Student Management</p>
</header>

<main>

  <section class="panel">
    <h2>Student Records</h2>

    <p class="status">
      Yahan registered students ki details dikhengi.
    </p>

    <input
      type="search"
      id="studentSearch"
      class="search"
      placeholder="Search by student name or email..."
      aria-label="Search students"
    >

    <p id="studentStatus" class="status" role="status">
      Admin access verify ho raha hai...
    </p>

    <div id="studentList"></div>
  </section>

  <p>
    <a class="back" href="admin.html">
      ← Back to Admin Dashboard
    </a>
  </p>

</main>
<script type="module">
import { initializeApp, getApps, getApp }
from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB8IW_3JhAhGuVvFwBUoqFKwEFEFZhDr6A",
  authDomain: "priyanshu-24f9b.firebaseapp.com",
  projectId: "priyanshu-24f9b",
  storageBucket: "priyanshu-24f9b.firebasestorage.app",
  messagingSenderId: "656305585506",
  appId: "1:656305585506:web:e75d7a29e9add61e67803b",
  measurementId: "G-PQPWFR9FHY"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const studentList = document.getElementById("studentList");
const studentStatus = document.getElementById("studentStatus");
const studentSearch = document.getElementById("studentSearch");

let students = [];

function renderStudents() {
  const query = studentSearch.value.trim().toLowerCase();
  studentList.replaceChildren();

  const filtered = students.filter(student =>
    (student.name || "").toLowerCase().includes(query) ||
    (student.email || "").toLowerCase().includes(query)
  );

  if (!filtered.length) {
    studentList.textContent = students.length
      ? "Koi matching student nahi mila."
      : "Abhi koi student record nahi mila.";
    return;
  }

  filtered.forEach(student => {
    const card = document.createElement("div");
    card.className = "student-card";

    const name = document.createElement("h3");
    name.textContent = student.name || "Name not available";

    const email = document.createElement("p");
    email.textContent = "Email: " + (student.email || "Not available");

    const phone = document.createElement("p");
    phone.textContent = "Mobile: " + (student.phone || "Not available");

    const date = document.createElement("p");
    const createdAt = student.createdAt?.toDate?.();
    date.textContent = "Registered: " +
      (createdAt ? createdAt.toLocaleDateString("en-IN") : "Not available");

    card.append(name, email, phone, date);
    studentList.appendChild(card);
  });
}

studentSearch.addEventListener("input", renderStudents);

onAuthStateChanged(auth, async user => {
  if (!user) {
    window.location.replace("login.html");
    return;
  }

  studentStatus.textContent = "Verifying admin access...";

  try {
    const adminSnap = await getDoc(doc(db, "admins", user.uid));

    if (!adminSnap.exists() || adminSnap.data().role !== "admin") {
      studentStatus.textContent = "Access denied.";
      await signOut(auth);
      window.location.replace("login.html");
      return;
    }

    studentStatus.textContent = "Admin verified. Loading students...";

    const snapshot = await getDocs(collection(db, "students"));

    students = snapshot.docs.map(document => document.data());

    studentStatus.textContent = "Total student records: " + students.length;

    renderStudents();

  } catch (error) {
    console.error("Student loading error:", error);
    studentStatus.textContent =
      "Students load nahi hue: " + error.message;
  }
});
</script>

</body>
</html>
